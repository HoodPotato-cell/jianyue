name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-checks:
    name: 前端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check
        run: |
          cd android/assets/web/js
          fail=0
          for f in *.js; do node --check "$f" || fail=1; done
          exit $fail

  windows:
    name: Windows 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        working-directory: windows
        run: npm install
      - name: 打包 portable + nsis
        working-directory: windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: jianyue-windows
          path: windows/dist/*
          if-no-files-found: error
